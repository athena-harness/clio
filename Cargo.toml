[workspace]
members = ["crates/clio-core", "crates/clio-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
clio-core = { path = "crates/clio-core" }
wasm-minimal-protocol = "0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
palette = { version = "0.7", default-features = false, features = ["std"] }
thiserror = "2"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
